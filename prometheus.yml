global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["host.docker.internal:5102"]
    metrics_path: /metrics

  - job_name: bookings-service
    static_configs:
      - targets: ["host.docker.internal:5103"]
    metrics_path: /metrics

  - job_name: users-service
    static_configs:
      - targets: ["host.docker.internal:5101"]
    metrics_path: /metrics