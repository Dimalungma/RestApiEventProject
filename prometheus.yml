global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    scheme: https
    static_configs:
      - targets: ["host.docker.internal:7202"]
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true

  - job_name: bookings-service
    scheme: https
    static_configs:
      - targets: ["host.docker.internal:7203"]
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true

  - job_name: users-service
    scheme: https
    static_configs:
      - targets: ["host.docker.internal:7201"]
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true